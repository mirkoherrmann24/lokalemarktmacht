<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Datenschutz | {{platform_title}}</title>
  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --navy:#0B1F35; --deep:#071628; --gold:#C8A84B; --gold2:#E2C46E; --white:#F5F0E8; --muted:#8A9BAD; --border:rgba(200,168,75,0.18); }
html { scroll-behavior:smooth; }
body { font-family:Georgia,serif; background:var(--deep); color:var(--white); font-size:17px; line-height:1.8; }
a { color:var(--gold); text-decoration:none; transition:opacity .2s; }
a:hover { opacity:.75; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:24px 48px; background:linear-gradient(to bottom, rgba(7,22,40,0.95), transparent); }
.logo { font-family:'Arial Narrow',Arial,sans-serif; font-weight:700; font-size:15px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); }
.nav-links { display:flex; align-items:center; gap:28px; }
.nav-links a { font-family:Arial,sans-serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
.nav-links a:hover { color:var(--gold); }
.breadcrumb { max-width:900px; margin:0 auto; padding:100px 32px 0; font-family:Arial,sans-serif; font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.breadcrumb a { color:var(--muted); }
.breadcrumb a:hover { color:var(--gold); opacity:1; }
.breadcrumb span { opacity:.35; }
article { max-width:900px; margin:0 auto; padding:32px; }
.hero-eyebrow { font-family:Arial,sans-serif; font-size:13px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.hero-eyebrow::before { content:""; width:28px; height:2px; background:var(--gold); display:block; }
h1 { font-size:clamp(26px,4vw,40px); font-weight:400; line-height:1.2; color:var(--white); margin-bottom:16px; letter-spacing:-.3px; }
h2 { font-size:clamp(20px,2.8vw,28px); font-weight:400; color:var(--white); margin-bottom:20px; line-height:1.3; margin-top:36px; }
h3 { font-family:Arial,sans-serif; font-size:16px; font-weight:700; color:var(--gold); margin-bottom:10px; margin-top:28px; }
p { margin-bottom:20px; color:var(--muted); }
p:last-child { margin-bottom:0; }
.content-body { margin-top:8px; }
.content-body a { color:var(--gold); }
.content-body strong { color:var(--white); }
hr { border:none; border-top:1px solid var(--border); margin:40px 0; }
.service-area { background:rgba(255,255,255,0.03); border-top:1px solid var(--border); padding:18px 24px; margin:32px 0 0; font-family:Arial,sans-serif; font-size:13px; color:var(--muted); line-height:1.7; display:flex; align-items:flex-start; gap:8px; }
.service-area svg { flex-shrink:0; margin-top:2px; color:var(--muted); }
.service-area strong { color:var(--white); }
footer { border-top:1px solid rgba(255,255,255,0.06); padding:28px 48px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.footer-logo { font-family:Arial,sans-serif; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }
.footer-links { display:flex; gap:24px; }
.footer-links a { font-family:Arial,sans-serif; font-size:13px; color:rgba(138,155,173,0.5); text-decoration:none; letter-spacing:1px; transition:color .2s; }
.footer-links a:hover { color:var(--muted); }
@media (max-width:700px) { nav { padding:16px 20px; } article { padding:24px 20px 60px; } footer { padding:24px 20px; } }</style>
</head>
<body>
<nav>
  <a href="/" class="logo">{{platform_title}}</a>
  <div class="nav-links">
    <a href="/#kontakt">KONTAKT</a>
  </div>
</nav>
<div class="breadcrumb">
  <a href="/">{{platform_title}}</a>
  <span>/</span>
  <span style="color:var(--white);">Datenschutz</span>
</div>
<article>
  <div class="hero-eyebrow">Datenschutz</div>
  <h1>{{content_headline}}</h1>
  <div class="content-body">{{{content_html}}}</div>
  {{service_area_block}}
</article>
<footer>
  <div class="footer-logo">{{platform_title}}</div>
  <div class="footer-links">
    <a href="/impressum">Impressum</a>
    <a href="/datenschutz">Datenschutz</a>
  </div>
</footer>
</body>
</html>
