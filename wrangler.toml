compatibility_date = "2024-09-23"

# Custom Domains — automatisch mit dem Worker verknüpft
routes = [
  { pattern = "lokalemarktmacht.de", custom_domain = true },
  { pattern = "holzbau-lokal.de", custom_domain = true },
  { pattern = "makler-lokal.de", custom_domain = true },
]

[assets]
directory = "."
binding = "ASSETS"
